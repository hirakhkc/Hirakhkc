name: Build Android APK

on:
  push:
    branches: [main, build-v3.5.0]
    paths:
      - "android/**"
      - ".github/workflows/build-android.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build installable APK
        run: gradle --no-daemon clean assembleDebug

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/Hirak_Jyotish_Chakra_Android_v3.5.0.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Hirak-Jyotish-Chakra-Android-v3.5.0-APK
          path: android/app/build/outputs/apk/debug/Hirak_Jyotish_Chakra_Android_v3.5.0.apk
          if-no-files-found: error
          retention-days: 90
