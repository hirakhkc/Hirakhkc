plugins { id 'com.android.application' }

android {
    namespace 'com.hirakchatterjee.jyotishchakra'
    compileSdk 36

    defaultConfig {
        applicationId 'com.hirakchatterjee.jyotishchakra'
        minSdk 26
        targetSdk 36
        versionCode 35
        versionName '3.5.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}
